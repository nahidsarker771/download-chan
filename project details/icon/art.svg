<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffdfbf"/>
      <stop offset="1" stop-color="#f4b98d"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd6ac"/>
      <stop offset="1" stop-color="#efa771"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eeeaff"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8277ff"/>
      <stop offset="1" stop-color="#5a4dea"/>
    </linearGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8fac" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff8fac" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#160f35" flood-opacity="0.28"/>
    </filter>
    <filter id="pawShadow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8b5539" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- tail -->
  <path d="M374 410 C430 430 458 398 444 364 C433 338 407 344 412 366"
        fill="none" stroke="#f0aa78" stroke-width="30" stroke-linecap="round"/>
  <path d="M412 366 C415 354 424 350 432 352"
        fill="none" stroke="#ffd6ac" stroke-width="22" stroke-linecap="round"/>

  <!-- ears -->
  <path d="M118 174 C102 128 106 92 132 89 C158 86 184 122 196 156 Z" fill="url(#fur)"/>
  <path d="M394 174 C410 128 406 92 380 89 C354 86 328 122 316 156 Z" fill="url(#fur)"/>
  <path d="M139 160 C129 132 132 111 144 109 C158 108 172 132 178 151 Z" fill="#ffb5a7"/>
  <path d="M373 160 C383 132 380 111 368 109 C354 108 340 132 334 151 Z" fill="#ffb5a7"/>

  <!-- chubby body -->
  <ellipse cx="256" cy="390" rx="148" ry="116" fill="url(#body)"/>
  <ellipse cx="256" cy="406" rx="98" ry="84" fill="#ffe6ca"/>

  <!-- head -->
  <ellipse cx="256" cy="224" rx="150" ry="132" fill="url(#fur)"/>

  <!-- forehead stripes -->
  <path d="M232 105 q7 12 0 23" fill="none" stroke="#efac7a" stroke-width="7" stroke-linecap="round"/>
  <path d="M256 100 q8 13 0 25" fill="none" stroke="#efac7a" stroke-width="7" stroke-linecap="round"/>
  <path d="M280 105 q7 12 0 23" fill="none" stroke="#efac7a" stroke-width="7" stroke-linecap="round"/>

  <!-- muzzle -->
  <ellipse cx="236" cy="274" rx="38" ry="31" fill="#fff4e6"/>
  <ellipse cx="276" cy="274" rx="38" ry="31" fill="#fff4e6"/>

  <!-- eyes -->
  <ellipse cx="203" cy="225" rx="22" ry="24" fill="#2d2543"/>
  <ellipse cx="309" cy="225" rx="22" ry="24" fill="#2d2543"/>
  <circle cx="196" cy="218" r="7" fill="#ffffff"/>
  <circle cx="302" cy="218" r="7" fill="#ffffff"/>
  <circle cx="208" cy="233" r="3.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="314" cy="233" r="3.5" fill="#ffffff" opacity="0.9"/>

  <!-- cheeks -->
  <ellipse cx="171" cy="272" rx="25" ry="12" fill="url(#blush)"/>
  <ellipse cx="341" cy="272" rx="25" ry="12" fill="url(#blush)"/>

  <!-- nose + happy smile -->
  <path d="M247 263 Q256 257 265 263 Q264 274 256 277 Q248 274 247 263 Z" fill="#f27996"/>
  <path d="M256 277 Q256 287 244 287" fill="none" stroke="#815064" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M256 277 Q256 287 268 287" fill="none" stroke="#815064" stroke-width="4.5" stroke-linecap="round"/>

  <!-- whiskers -->
  <path d="M144 263 q22 4 36 0" fill="none" stroke="#cf9169" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <path d="M145 280 q21 1 35 -4" fill="none" stroke="#cf9169" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <path d="M368 263 q-22 4 -36 0" fill="none" stroke="#cf9169" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <path d="M367 280 q-21 1 -35 -4" fill="none" stroke="#cf9169" stroke-width="4" stroke-linecap="round" opacity="0.75"/>

  <!-- paws holding the download card -->
  <path d="M160 349 C139 352 129 369 137 385 C145 400 170 401 184 390" fill="url(#fur)" filter="url(#pawShadow)"/>
  <path d="M352 349 C373 352 383 369 375 385 C367 400 342 401 328 390" fill="url(#fur)" filter="url(#pawShadow)"/>

  <!-- download card -->
  <g filter="url(#cardShadow)">
    <rect x="152" y="324" width="208" height="154" rx="30" fill="url(#card)"/>
  </g>

  <!-- download arrow -->
  <path d="M256 351 V411" fill="none" stroke="url(#arrow)" stroke-width="23" stroke-linecap="round"/>
  <path d="M227 388 L256 417 L285 388" fill="none" stroke="url(#arrow)" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M218 433 V445 H294 V433" fill="none" stroke="url(#arrow)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- paw toes -->
  <path d="M150 375 q8 5 17 1" fill="none" stroke="#dd9667" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M362 375 q-8 5 -17 1" fill="none" stroke="#dd9667" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>

  <!-- tiny sparkles -->
  <path d="M98 118 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" fill="#ffdf86"/>
  <path d="M421 128 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#cbbfff"/>
</svg>
